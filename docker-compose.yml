# Separate services, the shape you would run for real. Not used by the free demo.
services:
  postgres:
    image: postgres:17
    environment: {POSTGRES_USER: opp, POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: opp}
    ports: ["5434:5432"]
  rabbitmq:
    image: rabbitmq:4-management
    ports: ["5672:5672", "15672:15672"]
